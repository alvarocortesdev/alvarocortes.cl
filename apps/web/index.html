<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alvaro Cortes | Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set theme from system preference to prevent flash
      var t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      // Set lang early to prevent flash
      var l = localStorage.getItem('lang-preference');
      if (l === 'en' || l === 'es') document.documentElement.setAttribute('lang', l);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
