<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alvaro Cortes — Desarrollador Web Full Stack en Santiago, Chile. Portfolio, blog técnico y proyectos." />
    <meta name="keywords" content="desarrollador web, full stack, Santiago, Chile, React, TypeScript, portfolio" />
    <link rel="canonical" href="https://alvarocortes.cl/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Alvaro Cortes | Developer" />
    <meta property="og:description" content="Desarrollador Web Full Stack en Santiago, Chile. Portfolio, blog técnico y proyectos." />
    <meta property="og:image" content="https://alvarocortes.cl/android-chrome-512x512.png" />
    <meta property="og:url" content="https://alvarocortes.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alvaro Cortes | Developer" />
    <meta name="twitter:description" content="Desarrollador Web Full Stack en Santiago, Chile. Portfolio, blog técnico y proyectos." />
    <meta name="twitter:image" content="https://alvarocortes.cl/android-chrome-512x512.png" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Alvaro Cortes",
      "jobTitle": "Full Stack Web Developer",
      "url": "https://alvarocortes.cl",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Santiago",
        "addressCountry": "CL"
      }
    }
    </script>

    <title>Alvaro Cortes | Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set theme from system preference to prevent flash
      var t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      // Set lang early to prevent flash
      var l = localStorage.getItem('lang-preference');
      if (l === 'en' || l === 'es') document.documentElement.setAttribute('lang', l);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
